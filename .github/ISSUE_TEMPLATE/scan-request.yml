name: Scan Request
description: Submit one or more URLs for an accessibility scan.
title: "SCAN: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Accessibility Scan Request

        Complete the fields below to queue an accessibility scan. The issue title **must** begin with `SCAN:` — add a short description after it (e.g. `SCAN: GSA.gov homepage`).

        > **Tip:** You can also use the [web form](https://mgifford.github.io/open-scans/) to pre-fill this template automatically.

        > **Optional assisted inventory:** tick the checkbox at the end, or add `ASSISTED:` to the title / `Assisted: yes` to the body. Leave it off for the default scan.

  - type: textarea
    id: urls
    attributes:
      label: URLs
      description: >
        Enter one URL per line. Only public `https://` or `http://` URLs are accepted
        (no localhost, private IPs, or non-web documents). Maximum 500 URLs.
      placeholder: |
        https://www.example.gov/
        https://www.example.gov/about
        https://www.example.gov/contact
    validations:
      required: true

  - type: dropdown
    id: engines
    attributes:
      label: Accessibility engines
      description: >
        Choose which scanning engines to run.
        You can also specify engines in the issue **title** by including a keyword
        (e.g. `SCAN: AXE my site`) or add `Engine: axe, alfa` as the first line of
        the body after submitting.
      options:
        - Default (axe + one random engine)
        - ALL
        - axe
        - alfa
        - equalaccess
        - accesslint
        - sa11y
      default: 0
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Supported engines:** axe-core · Siteimprove ALFA · IBM Equal Access Checker · AccessLint · Sa11y

        Once this issue is saved the scan starts automatically. Results will be posted as a comment on this issue and published to [GitHub Pages](https://mgifford.github.io/open-scans/reports.html).

  - type: dropdown
    id: viewport
    attributes:
      label: Viewport
      description: >
        Choose the screen size to emulate. For a custom size, select the custom option
        and then edit the issue body after saving to replace the viewport value with
        `Viewport: WIDTHxHEIGHT`.
      options:
        - Default (1280×800 desktop)
        - Tablet portrait (768×1024)
        - Tablet landscape (1024×768)
        - Mobile portrait (390×844)
        - Mobile landscape (844×390)
        - Custom (WxH)
      default: 0
    validations:
      required: false

  - type: dropdown
    id: color-scheme
    attributes:
      label: Color scheme
      description: Choose whether to scan light mode, dark mode, or both.
      options:
        - Auto-detect (run both if page supports dark mode)
        - Light only
        - Dark only
      default: 0
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: >
        Choose the browser for Playwright-based scans. Random browser picks one of
        Chromium, Firefox, or WebKit for this scan while still allowing explicit overrides.
      options:
        - Random browser (one per scan)
        - Chromium
        - Firefox
        - WebKit (Safari-like)
      default: 0
    validations:
      required: false

  - type: checkboxes
    id: assisted
    attributes:
      label: Assisted element inventory
      description: |
        Optional. Adds one extra browser pass per captured page and publishes
        `assessment-collectors.json` beside the report. For six pages the measured cost is
        about 13.5 seconds nominal (14.5–16.7 seconds observed) and about 1.95 MB. It
        captures headings, images and links for a human to review, top document only,
        without interaction or scrolling, and can be truncated by caps. It is not a
        finding, a score or a WCAG conformance result. Leave unchecked for the default
        scan, which launches no collector browser.
      options:
        - label: Capture the assisted inventory for manual review
          required: false
